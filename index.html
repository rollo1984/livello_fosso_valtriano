<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoraggio Livello Acqua</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background-color: #121212; /* Sfondo scuro della pagina */
            color: #e0e0e0; 
            padding: 40px; 
            margin: 0;
        }
        .card { 
            background: #1e1e1e; /* Sfondo scuro del riquadro */
            padding: 25px; 
            border-radius: 12px; 
            display: inline-block; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            border: 1px solid #333;
        }
        h2 { 
            color: #ffffff; 
            margin-top: 0; 
            margin-bottom: 20px;
        }
        /* Dimensioni originali fisse per evitare che il grafico si veda monco */
        iframe {
            width: 450px;
            height: 260px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #ffffff;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Livello Acqua in Tempo Reale</h2>
        
        <!-- Grafico ThingSpeak con le dimensioni originali -->
        <iframe src="https://thingspeak.com/channels/3549299/charts/1"></iframe>
        
    </div>
</body>
</html>
