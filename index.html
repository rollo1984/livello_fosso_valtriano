<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitoraggio Livello Fosso Valtriano</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            background-color: #121212; 
            color: #e0e0e0; 
            padding: 40px; 
            margin: 0;
        }
        .card { 
            background: #1e1e1e; 
            padding: 25px; 
            border-radius: 12px; 
            display: inline-block; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); 
            border: 1px solid #333;
        }
        h2 { 
            color: #ffffff; 
            margin-top: 0; 
            margin-bottom: 20px;
        }
        iframe {
            width: 450px;
            height: 260px;
            border: 1px solid #333;
            border-radius: 8px;
            background: #000000;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Livello Fosso Valtriano</h2>
        
        <!-- Grafico ThingSpeak con tutti i parametri della tua schermata -->
        <iframe src="https://thingspeak.mathworks.com/channels/3549299/charts/1?average=10&bgcolor=%23000000&color=%23ffffff&days=1&dynamic=true&round=2&title=Livello+Fosso+Valtriano&type=line&xaxis=Ore&yaxismax=2&yaxismin=0"></iframe>
    </div>
</body>
</html>
